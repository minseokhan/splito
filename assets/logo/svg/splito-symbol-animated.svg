<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="Splito">
<style>
.sp-card{animation:sp-pop 2.8s cubic-bezier(.34,1.56,.64,1) infinite}
.sp-card.y{animation-delay:.12s}
@keyframes sp-pop{
0%{transform:translateY(0)}
14%{transform:translateY(-10px)}
26%{transform:translateY(1.6px)}
33%{transform:translateY(-1.8px)}
40%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.sp-card{animation:none}}
</style>
<defs>
<linearGradient id="spb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EC8FF"/><stop offset="1" stop-color="#1668E3"/></linearGradient>
<linearGradient id="spf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C2EEFF"/><stop offset="1" stop-color="#6FCBFA"/></linearGradient>
<linearGradient id="spm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7CF0D8"/><stop offset="1" stop-color="#12B39C"/></linearGradient>
<linearGradient id="spy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE68A"/><stop offset="1" stop-color="#FF9F2E"/></linearGradient>
</defs>

<g class="sp-card m"><g transform="rotate(-12 38 43)"><rect x="20" y="20" width="36" height="46" rx="8" fill="url(#spm)"/></g></g>
<g class="sp-card y"><g transform="rotate(10 62 43)"><rect x="44" y="20" width="36" height="46" rx="8" fill="url(#spy)"/></g></g>
<rect x="16" y="42" width="68" height="40" rx="13" fill="url(#spb)"/>
