<path d="M16,55 V54 C16,47 21,42 28,42 H72 C79,42 84,47 84,54 V55 C84,59 81,62 77,62 H23 C19,62 16,59 16,55 Z" fill="url(#spf)"/>
<path d="M24,46 H36" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round"/>
<path d="M50,53.2 Q51.6,61.6 60,63.2 Q51.6,64.8 50,73.2 Q48.4,64.8 40,63.2 Q48.4,61.6 50,53.2 Z" fill="#1683CC" opacity="0.3"/>
