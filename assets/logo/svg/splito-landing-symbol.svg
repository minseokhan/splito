<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -4 112 112" role="img" aria-label="Splito">
<style>
.sp-tile{transform-box:fill-box;transform-origin:center;animation:sp-pop .7s cubic-bezier(.34,1.56,.64,1) both}
.sp-s{transform-box:fill-box;transform-origin:30% 20%;animation:sp-s-in .8s cubic-bezier(.22,1,.36,1) .35s both}
.sp-tri{transform-box:fill-box;transform-origin:center;animation:sp-go-in .55s cubic-bezier(.22,1,.36,1) .9s both, sp-go 3.6s ease-in-out 2.4s infinite}
.sp-star{transform-box:fill-box;transform-origin:center;animation:sp-star-in .6s cubic-bezier(.34,1.56,.64,1) 1.15s both, sp-twinkle 3.6s ease-in-out 2.6s infinite}
.sp-mini{transform-box:fill-box;transform-origin:center;opacity:0;animation:sp-mini 3.6s ease-in-out 2.8s infinite}
.sp-mini.b{animation-delay:3s}
@keyframes sp-pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes sp-s-in{0%{opacity:0;transform:translate(-5px,-7px) rotate(-14deg) scale(.82)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes sp-go-in{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:translateX(0)}}
@keyframes sp-go{0%,70%,100%{transform:translateX(0)}78%{transform:translateX(3.5px)}86%{transform:translateX(-1px)}92%{transform:translateX(0)}}
@keyframes sp-star-in{0%{opacity:0;transform:scale(0) rotate(-90deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes sp-twinkle{0%,60%,100%{transform:scale(1) rotate(0)}68%{transform:scale(.78) rotate(30deg)}78%{transform:scale(1.15) rotate(45deg)}88%{transform:scale(1) rotate(90deg)}}
@keyframes sp-mini{0%,62%,100%{opacity:0;transform:scale(0)}74%{opacity:1;transform:scale(1)}88%{opacity:0;transform:scale(.4)}}
@media (prefers-reduced-motion:reduce){.sp-tile,.sp-s,.sp-tri,.sp-star,.sp-mini{animation:none}.sp-mini{opacity:0}}
</style>
<defs><linearGradient id="sp-mid" gradientUnits="userSpaceOnUse" x1="25" y1="15" x2="75" y2="88"><stop offset="0" stop-color="#1E4FD8"/><stop offset="1" stop-color="#0E1B3D"/></linearGradient>
<linearGradient id="sp-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#FFB020"/></linearGradient>
<filter id="sp-sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E4FD8" flood-opacity="0.16"/></filter>
</defs>

<g transform="translate(-8.5 0)">
<g class="sp-s"><path transform="translate(0 50) scale(1 0.88) translate(0 -50)" d="M43,15 C29,25 29,42 45,50 L63,60 C70,64 71,74 63,85 C85,78 89,57 73,46 L56,35.5 C48,31 41,26 43,15 Z" fill="url(#sp-mid)"/></g>
<path class="sp-tri" d="M37.5,59.8 L56.5,70.3 L37.5,80.8 Z" fill="url(#sp-mid)"/>
<path class="sp-star" d="M69.5,16 Q71.04,25.46 80.5,27 Q71.04,28.54 69.5,38 Q67.96,28.54 58.5,27 Q67.96,25.46 69.5,16 Z" fill="url(#sp-gold)"/>
<path class="sp-mini" d="M83.5,9.8 Q83.95,12.55 86.7,13 Q83.95,13.45 83.5,16.2 Q83.05,13.45 80.3,13 Q83.05,12.55 83.5,9.8 Z" fill="url(#sp-gold)"/>
<path class="sp-mini b" d="M57,11.1 Q57.34,13.16 59.4,13.5 Q57.34,13.84 57,15.9 Q56.66,13.84 54.6,13.5 Q56.66,13.16 57,11.1 Z" fill="url(#sp-gold)"/>
</g>
</svg>