<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>이 자리 정산 · 스플리토</title>
  <link rel="stylesheet" href="/s/spot.css">
  <script src="/s/spot.js" defer></script>
</head>
<body class="spot">
  <div class="bar"><span class="lock" id="addr"></span></div>

  <main id="main" aria-busy="true">
    <img class="brand" src="/s/splito-wordmark.png" alt="Splito" height="26">

    <p class="state" id="state">불러오는 중…</p>

    <!-- 아래는 전부 불러온 뒤에 보인다 -->
    <div id="body" hidden>
      <div class="head">
        <h1 id="title"></h1>
        <p class="sub" id="lead"></p>
      </div>

      <!-- 영수증 티켓(확인하고 나누기 18번 ③과 같은 모양). 세 단계 공통 -->
      <section class="ticket">
        <div class="t-top">
          <span class="cat" id="cat" aria-hidden="true">
            <svg id="catIcon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></svg>
          </span>
          <div class="t-info">
            <strong id="merchant"></strong>
            <p class="amt"><span id="amtMain"></span><span class="krw" id="amtKrw"></span></p>
            <p class="meta" id="when"></p>
            <p class="meta sched" id="sched">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M15 4V2M15 4V6M15 4H10.5M3 10V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V10H3Z"></path>
                <path d="M3 10V6C3 4.89543 3.89543 4 5 4H7"></path><path d="M7 2V6"></path>
                <path d="M21 10V6C21 4.89543 20.1046 4 19 4H18.5"></path>
              </svg>
              <span id="schedTitle"></span>
            </p>
          </div>
        </div>
        <div class="perf" aria-hidden="true"></div>
        <p class="t-count" id="itemCount"></p>
        <ul class="items" id="items"></ul>
        <div class="t-foot">
          <div class="row"><span>함께한 사람</span><span class="people" id="people"></span></div>
          <div class="row mine"><span>내 몫</span><strong id="share"></strong></div>
        </div>
      </section>
      <div class="wavy" aria-hidden="true"></div>

      <!-- 참여 -->
      <section id="joinBox" hidden>
        <label class="label" for="name">내 이름</label>
        <input id="name" type="text" maxlength="12" autocomplete="name" enterkeyhint="done"
               placeholder="동행이 알아볼 이름을 입력해 주세요">
      </section>

      <!-- 송금 안내 -->
      <section id="payBox" class="panel pay" hidden>
        <div>
          <p class="sub" id="accountFor"></p>
          <strong id="account"></strong>
        </div>
        <button type="button" id="copy" class="ghost">복사</button>
      </section>

      <!-- 완료 -->
      <section id="doneBox" class="panel app" hidden>
        <strong>여행 경비, 스플리토로 나눠 보세요</strong>
        <p class="sub">영수증 한 장이면 품목까지 나눠서 정산돼요.</p>
      </section>

      <div class="cta-bar"><button type="button" id="cta" class="btn"></button></div>
    </div>
  </main>

  <p class="toast" id="toast" role="status" hidden></p>
</body>
</html>
